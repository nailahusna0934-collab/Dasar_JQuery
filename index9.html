<!DOCTYPE html>
<html>
<head>
    <title>Mendapatkan nilai dan value dengan JQuery</title>
    <script type="text/javascript" src="jquery-4.0.0.js"></script>
    <link rel="stylesheet" type="text/css" href="style9.css">
</head>
<body>
    <h1>Get Function JQuery</h1>
    <button id="tombol">KLIK</button>
    <p class="kata">Selamat belajar jquery</p>
</body>

<script type="text/javascript">
    $(document).ready(function(){
        $('#tombol').click(function(){
            var teks = $('.kata').text();
            alert(teks);
        });
    });
</script>
</html>










<!DOCTYPE html>
<html>
    <head>
        <title>Mendapatkan nilai dan value dengan JQuery</title>
        <script type="text/javascript" src="jquery.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
<body>
    <h1>Get Function JQuery</h1>
    <input type="text" name="nama" class="nama">
    <button id="tombol">KLIK</button>
</body>
<script type="text/javascript">
    $(document).ready(function(){
        $('#tombol').click(function(){
            var nama = $(".nama").attr('type');
            alert(nama);
        });
    });
</script>
</html>
