<!DOCTYPE html>
<html>
<head>
    <title>Jquery Dasar</title>
    <script type="text/javascript" src="jquery-4.0.0.js"></script>
    <link rel="stylesheet" type="text/css" href="style6.css">
</head>
<body>
    <h1>Callback Function pada JQuery</h1>
    <button id="tombol">KLIK</button>
    <div class="box"></div>
    <div class="kotak_biru">function callback di jalankan</div>
</body>
<script type="text/javascript">
    $(document).ready(function(){
        $('#tombol').click(function(){
            $('.box').fadeIn(800,function(){
                $('.kotak_biru').show(); });
        });
    });
</script>
</html>
