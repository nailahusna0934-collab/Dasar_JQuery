<!DOCTYPE html>
<html>
<head>
    <title>Menetapkan nilai dan value dengan JQuery</title>
    <script type="text/javascript" src="jquery-4.0.0.js"></script>
    <link rel="stylesheet" type="text/css" href="style13.css">
</head>
<body>
    <h1>Set Function JQuery</h1>
    <button id="tombol">KLIK</button>
    <p class="nama"></p>
</body>
<script type="text/javascript">
    $(document).ready(function(){
        $('#tombol').click(function(){
            $('.nama').html("<div class='kotak'>belajar pemrograman web PPLG</div>");
        });
    });
</script>
</html>
