<!DOCTYPE html>
<html>
<head>
    <title>Jquery Dasar</title>
    <script type="text/javascript" src="jquery-4.0.0.js"></script>
    <link rel="stylesheet" type="text/css" href="style4.css">
</head>
<body>
    <h1>Effect JQuery</h1>

    <button id="tombol">Tampilkan kotak (slideDown)</button>
    <button id="tombol2">Sembunyikan kotak (slideUp)</button>
    <button id="tombol3">Effect slide Toggle kotak (slideToggle)</button>

    <div class="box"></div>
</body>
<script type="text/javascript">
    $(document).ready(function(){

        $('#tombol').click(function(){
            $('.box').slideDown();
        });

        $('#tombol2').click(function(){
            $('.box').slideUp();
        });

        $('#tombol3').click(function(){
            $('.box').slideToggle();
        });

    });
</script>
</html>
